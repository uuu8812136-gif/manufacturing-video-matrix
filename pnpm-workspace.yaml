packages:
  - 'packages/*'

verifyDepsBeforeRun: false

overrides:
  file-type: 21.3.2
  js-yaml: 4.3.0
  lodash: 4.18.1
  multer: 2.2.0
  path-to-regexp: 8.4.0
  qs: 6.15.2
  uuid: 11.1.1

packageExtensions:
  '@chenshuai2144/sketch-color@*':
    dependencies:
      lodash: 4.18.1

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - bcrypt
  - esbuild
  - '@nestjs/core'
  - msgpackr-extract

dangerouslyAllowAllBuilds: true
